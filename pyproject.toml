[project]
name = "nexum-ai-core"
version = "0.1.0"
description = "Nexum AI Core: model, agents, tools, memory, training and evaluation."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
training = [
  "torch>=2.4",
  "transformers>=4.45",
  "datasets>=3.0",
  "peft>=0.13",
  "accelerate>=1.0",
  "trl>=0.11",
]

dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
